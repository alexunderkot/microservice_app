apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          env: 
            - name: JAEGER_ENDPOINT
              value: "http://{{ .Release.Name }}-jaeger:{{ .Values.jaeger.otlpPort }}"
            - name: REDIS_HOST
              value: "{{ .Release.Name }}-redis"