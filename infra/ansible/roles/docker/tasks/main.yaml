---
- name: Time sync
  shell: timedatectl set-ntp true

- name: Wait for time sync
  shell: "timedatectl status | grep 'System clock synchronized: yes'"
  retries: 10
  delay: 3
  register: result
  until: result.rc == 0

- name: Install curl
  apt:
    name: curl
    state: present
    update_cache: yes

- name: add GPG key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.asc

- name: Add official docker repository
  apt_repository:
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable
    state: present

- name: Install docker-ce
  apt:
    name: docker-ce
    state: present
    update_cache: yes

- name: Add u deploy to docker group
  user:
    name: deploy
    groups: docker
    append: yes

- name: Install docker python sdk
  apt:
    name: python3-docker
    state: present

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Configure Docker storage driver
  copy:
    content: |
      {
        "storage-driver": "vfs"
      }
    dest: /etc/docker/daemon.json
  notify: Restart Docker

- name: Flush handlers
  meta: flush_handlers

- name: Reset SSH connection
  meta: reset_connection